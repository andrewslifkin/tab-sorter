<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tab Organizer - Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      margin-top: 0;
      color: #333;
      font-size: 24px;
    }
    
    .section {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }
    
    select, input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    select:focus, input:focus {
      outline: none;
      border-color: #4285f4;
    }
    
    .api-key-section {
      display: none;
      margin-top: 15px;
    }
    
    .api-key-section.active {
      display: block;
    }
    
    .help-text {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }
    
    .help-text a {
      color: #4285f4;
      text-decoration: none;
    }
    
    .help-text a:hover {
      text-decoration: underline;
    }
    
    button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #357ae8;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ AI Tab Organizer Settings</h1>
    
    <div class="warning">
      ⚠️ API keys are stored locally in your browser. Never share your extension or sync data with untrusted parties.
    </div>
    
    <form id="options-form">
      <div class="section">
        <label for="provider">AI Provider:</label>
        <select id="provider" name="provider">
          <option value="openai">OpenAI (GPT-4o Mini)</option>
          <option value="anthropic">Anthropic (Claude Haiku)</option>
          <option value="gemini">Google Gemini (Flash)</option>
        </select>
      </div>
      
      <div id="openai-section" class="api-key-section">
        <label for="openai-key">OpenAI API Key:</label>
        <input type="password" id="openai-key" name="openaiKey" placeholder="sk-...">
        <div class="help-text">
          Get your API key from <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI Platform</a>
        </div>
      </div>
      
      <div id="anthropic-section" class="api-key-section">
        <label for="anthropic-key">Anthropic API Key:</label>
        <input type="password" id="anthropic-key" name="anthropicKey" placeholder="sk-ant-...">
        <div class="help-text">
          Get your API key from <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic Console</a>
        </div>
      </div>
      
      <div id="gemini-section" class="api-key-section">
        <label for="gemini-key">Google Gemini API Key:</label>
        <input type="password" id="gemini-key" name="geminiKey" placeholder="AIza...">
        <div class="help-text">
          Get your API key from <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
        </div>
      </div>
      
      <button type="submit">Save Settings</button>
      
      <div id="status" class="status"></div>
    </form>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
